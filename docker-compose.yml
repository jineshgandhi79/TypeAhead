version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: typeahead-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - typeahead-network

  redis-1:
    image: redis:alpine
    container_name: typeahead-redis-1
    ports:
      - "6379:6379"
    networks:
      - typeahead-network

  redis-2:
    image: redis:alpine
    container_name: typeahead-redis-2
    ports:
      - "6380:6379"
    networks:
      - typeahead-network

  redis-3:
    image: redis:alpine
    container_name: typeahead-redis-3
    ports:
      - "6381:6379"
    networks:
      - typeahead-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: typeahead-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/typeahead
      - REDIS_NODES=redis-1:6379,redis-2:6379,redis-3:6379
      - PORT=5000
      - BATCH_SIZE=100
      - BATCH_FLUSH_INTERVAL=5000
      - PRELOAD_LIMIT=150000
      - NODE_ENV=production
    volumes:
      - ./dataset:/app/dataset
    depends_on:
      - mongodb
      - redis-1
      - redis-2
      - redis-3
    networks:
      - typeahead-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: typeahead-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - typeahead-network

volumes:
  mongodb_data:

networks:
  typeahead-network:
    driver: bridge
